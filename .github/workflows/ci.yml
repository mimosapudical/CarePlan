name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  web:
    name: TypeScript product application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  test:
    name: Migrate and pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careplan
          POSTGRES_USER: careplan
          POSTGRES_PASSWORD: careplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careplan -d careplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: careplan_mvp.settings
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CAREPLAN_QUEUE_NAME: careplan_queue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Validate OpenAPI contract
        run: python scripts/validate_openapi.py

      - name: Run Django migrations
        run: python manage.py migrate --noinput

      - name: Run pytest
        run: pytest -q

  operator:
    name: Go operator tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      - name: Run go test
        run: go test ./...

      - name: Run go vet
        run: go vet ./...
