name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Migrate and pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careplan
          POSTGRES_USER: careplan
          POSTGRES_PASSWORD: careplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careplan -d careplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: careplan_mvp.settings
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CAREPLAN_QUEUE_NAME: careplan_queue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django migrations
        run: python manage.py migrate --noinput

      - name: Run pytest
        run: pytest -q

  operator:
    name: Go operator tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      - name: Run go test
        run: go test ./...

      - name: Run go vet
        run: go vet ./...
