name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  web:
    name: TypeScript product application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e

  test:
    name: Migrate and pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careplan
          POSTGRES_USER: careplan
          POSTGRES_PASSWORD: careplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careplan -d careplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: careplan_mvp.settings
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CAREPLAN_QUEUE_NAME: careplan_queue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check Django migrations are current
        run: python manage.py makemigrations --check

      - name: Validate OpenAPI contract
        run: python scripts/validate_openapi.py

      - name: Run Django migrations
        run: python manage.py migrate --noinput

      - name: Run pytest
        run: pytest -q

  operator:
    name: Go operator tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      - name: Run go test
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

  spring-careplan-api:
    name: Java 21 Spring CarePlan read API
    runs-on: ubuntu-latest
    needs:
      - web
      - test
      - operator
    env:
      APPDATA: /tmp/careplan-ci-appdata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: spring-careplan-api/pom.xml

      - name: Run Spring tests
        working-directory: spring-careplan-api
        run: mvn -B test

      - name: Package Spring service
        working-directory: spring-careplan-api
        run: mvn -B package

      - name: Prepare Compose verification inputs
        run: |
          mkdir -p "$APPDATA/gcloud"
          printf '{}\n' > "$APPDATA/gcloud/application_default_credentials.json"
          : > .env

      - name: Build Docker Compose services
        run: docker compose build

      - name: Start PostgreSQL, Django, and Spring
        run: docker compose up -d postgres web spring-careplan-api

      - name: Wait for both APIs
        run: |
          django_ready=0
          spring_ready=0

          for attempt in $(seq 1 60); do
            if [ "$django_ready" -eq 0 ]; then
              django_code=$(curl -sS -o /tmp/django-health.json -w '%{http_code}' \
                "http://localhost:8000/api/ops/care-plans/" || true)
              if [ "$django_code" = "200" ]; then
                django_ready=1
                echo "Django API ready on attempt $attempt"
              fi
            fi

            if [ "$spring_ready" -eq 0 ]; then
              spring_code=$(curl -sS -o /tmp/spring-health.json -w '%{http_code}' \
                "http://localhost:8080/actuator/health" || true)
              if [ "$spring_code" = "200" ]; then
                spring_ready=1
                echo "Spring API ready on attempt $attempt"
                cat /tmp/spring-health.json
              fi
            fi

            if [ "$django_ready" -eq 1 ] && [ "$spring_ready" -eq 1 ]; then
              exit 0
            fi

            sleep 2
          done

          echo "Django ready: $django_ready"
          echo "Spring ready: $spring_ready"
          if [ -f /tmp/django-health.json ]; then
            echo "Last Django response:"
            cat /tmp/django-health.json || true
          fi
          if [ -f /tmp/spring-health.json ]; then
            echo "Last Spring response:"
            cat /tmp/spring-health.json || true
          fi
          exit 1

      - name: Verify Django/Spring contract parity on the same row
        run: |
          CAREPLAN_ID=$(docker compose exec -T web python manage.py shell -c '
          from careplans.models import CarePlan
          row = CarePlan.objects.create(
              status=CarePlan.STATUS_COMPLETED,
              history=[CarePlan.STATUS_PENDING, CarePlan.STATUS_COMPLETED],
              payload={"patient_first_name": "Parity", "patient_mrn": "PAR001"},
              care_plan={"goals": ["Parity goal"]},
          )
          print(row.id)
          ' | tail -n 1 | tr -d '\r')
          test -n "$CAREPLAN_ID"

          curl -fsS "http://localhost:8000/api/care-plans/$CAREPLAN_ID/" > /tmp/django-detail.json
          curl -fsS "http://localhost:8080/api/v1/careplans/$CAREPLAN_ID" > /tmp/spring-detail.json
          curl -fsS "http://localhost:8000/api/care-plans/$CAREPLAN_ID/status/" > /tmp/django-status.json
          curl -fsS "http://localhost:8080/api/v1/careplans/$CAREPLAN_ID/status" > /tmp/spring-status.json
          curl -fsS "http://localhost:8000/api/ops/care-plans/?status=completed&stale_minutes=30" > /tmp/django-ops.json
          curl -fsS "http://localhost:8080/api/v1/ops/careplans?status=completed&stale_minutes=30" > /tmp/spring-ops.json

          python3 - <<'PY'
          import json
          from datetime import datetime

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          def same_timestamp(left, right):
              if left is None or right is None:
                  return left is right
              parse = lambda value: datetime.fromisoformat(value.replace("Z", "+00:00"))
              return parse(left) == parse(right)

          django_detail = load("/tmp/django-detail.json")
          spring_detail = load("/tmp/spring-detail.json")
          assert set(django_detail) == set(spring_detail)
          for key in {"id", "status", "history", "payload", "care_plan", "error"}:
              assert django_detail[key] == spring_detail[key], key
          for key in {"queued_at", "created_at", "updated_at"}:
              assert same_timestamp(django_detail[key], spring_detail[key]), key

          django_status = load("/tmp/django-status.json")
          spring_status = load("/tmp/spring-status.json")
          assert django_status == spring_status

          django_ops = load("/tmp/django-ops.json")["results"]
          spring_ops = load("/tmp/spring-ops.json")["results"]
          target_id = django_detail["id"]
          django_row = next(row for row in django_ops if row["id"] == target_id)
          spring_row = next(row for row in spring_ops if row["id"] == target_id)
          assert set(django_row) == set(spring_row)
          for key in {"id", "status", "error", "manual_retry_count", "stale"}:
              assert django_row[key] == spring_row[key], key
          for key in {"queued_at", "created_at", "updated_at", "last_manual_retry_at"}:
              assert same_timestamp(django_row[key], spring_row[key]), key
          PY

      - name: Dump Compose diagnostics
        if: failure()
        run: |
          docker compose ps -a
          echo "=== postgres ==="
          docker compose logs --no-color --tail=300 postgres || true
          echo "=== redis ==="
          docker compose logs --no-color --tail=300 redis || true
          echo "=== web ==="
          docker compose logs --no-color --tail=300 web || true
          echo "=== spring-careplan-api ==="
          docker compose logs --no-color --tail=300 spring-careplan-api || true

      - name: Stop Compose services
        if: always()
        run: docker compose down -v
