apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: careplan-operator
rules:
  - apiGroups: ["careplan.example.io"]
    resources: ["careplanjobs", "careplanjobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

