apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: careplanjobs.careplan.example.io
spec:
  group: careplan.example.io
  names:
    kind: CarePlanJob
    listKind: CarePlanJobList
    plural: careplanjobs
    singular: careplanjob
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - carePlanId
                - image
              properties:
                carePlanId:
                  type: string
                  minLength: 1
                image:
                  type: string
                  minLength: 1
                backoffLimit:
                  type: integer
                  minimum: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                jobName:
                  type: string
                message:
                  type: string

