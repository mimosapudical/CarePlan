x-app-env: &app-env
  POSTGRES_DB: careplan
  POSTGRES_USER: careplan
  POSTGRES_PASSWORD: careplan
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CAREPLAN_QUEUE_NAME: careplan_queue
  CAREPLAN_EXECUTION_BACKEND: celery
  GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json

services:
  frontend:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      DJANGO_API_BASE_URL: http://web:8000
    depends_on:
      - web

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A careplan_mvp worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  test:
    build: .
    command: pytest -q
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: careplan_mvp.settings
    depends_on:
      - postgres
      - redis
    profiles:
      - test

volumes:
  postgres_data:
